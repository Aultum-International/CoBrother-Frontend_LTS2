name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Public repo: shallow clone without GITHUB_TOKEN (avoids 403 when owner account is suspended)
      - name: Checkout
        run: |
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          set -euo pipefail

          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || { echo "Missing SSH_PRIVATE_KEY"; exit 1; }
          [ -n "${{ secrets.SERVER_HOST }}" ] || { echo "Missing SERVER_HOST"; exit 1; }
          [ -n "${{ secrets.SERVER_USER }}" ] || { echo "Missing SERVER_USER"; exit 1; }

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          echo -e "Host *\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

          ssh-keyscan -T 20 -p 22 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Copy dist to server
        run: |
          scp -P 2222 -i ~/.ssh/deploy_key -r dist/* ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/frontend/

      - name: Reload Nginx
        run: |
          ssh -p 2222 -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo systemctl reload nginx"